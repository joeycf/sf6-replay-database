name: Daily data refresh

on:
  schedule:
    # 07:17 UTC daily (odd minute to dodge cron rush; the third stagger slot on
    # the platform, after 2XKO's 06:17 and Tekken's 06:47, so the three
    # refreshes never contend)
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # matches engines.node (the platform's Node policy — STACK.md §1)
          node-version: 24
          cache: npm

      - run: npm ci

      # fetch + parse + emit (character art is NOT part of the daily run —
      # scripts/characters.ts only runs when the roster changes)
      - name: Fetch channel uploads
        run: npm run data:fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      # THE INDEX PULL, AND IT IS ALLOWED TO FAIL.
      #
      # This is the second half of "the cron never depends on Replay Theater
      # succeeding", and it is deliberately a step of its own rather than a link
      # in `data:build`'s && chain — a chain would take the whole refresh down
      # with it, which is exactly the dependency the split exists to avoid.
      #
      # continue-on-error marks the run yellow and moves on. scripts/parse.ts
      # then finds no dump, carries the committed records, and everything else
      # about the day proceeds normally. The cost of a bad morning upstream is
      # that morning's new entries; nothing already committed is at risk,
      # because this intake is add-only.
      #
      # LAST OF THE FETCHES, so a failure here cannot cost the channel dumps
      # that were already fetched above. It reads a bounded cursor (~3 pages,
      # 10 max) rather than the 311-page catalogue — see scripts/fetch-theater.ts.
      #
      # YT_API_KEY is repeated on purpose: `env:` is per step, and
      # requireApiKey() runs at module load, so without it this exits 1 before it
      # has read anything.
      - name: Fetch the tournament index (Replay Theater)
        continue-on-error: true
        run: npm run data:theater
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Parse and emit
        run: npm run data:parse

      - name: Commit if changed
        run: |
          git config user.name "sf6-data-refresh[bot]"
          git config user.email "data-refresh@users.noreply.github.com"
          # substrate + generic artifacts land in the same commit or the
          # site's data desyncs from the pipeline substrate (Phase-3 pattern).
          # patchGroups.json IS included: unlike Tekken, SF6 pre-declares an
          # upcoming season boundary, so a daily run can legitimately change it.
          # summary.json is the apex selector's card payload (Phase 6); it is
          # content-derived (newest replay date, not build time), so a
          # no-new-video day leaves it byte-identical and the guard below still
          # skips the commit.
          # review-queue.json is parse-regenerated derived state (a new
          # ambiguous KingArena upload should appear in the committed queue);
          # content-only, no timestamp, so a quiet day leaves it byte-identical.
          # theater-cursor.json is where the index pull remembers how far it has
          # read. raw/ is gitignored and CI starts from a fresh checkout, so if
          # this is not committed the cursor resets to 0 every morning and every
          # run becomes a bounded sweep that never goes quiet. Content-only (one
          # integer, no timestamp) so a quiet day leaves it byte-identical.
          git add data/videos.json data/replays.json data/stats.json data/players.json data/patchGroups.json data/patchBoundaries.json data/summary.json data/seasonBoundaries.json data/review-queue.json data/source-pins.json data/theater-cursor.json data/theater-disagreements.json data/report.md
          # report.md's "_Generated <timestamp>_" line changes every run; a diff
          # that is ONLY that line is not a data change — drop it so a no-change
          # day produces no commit (and no deploy). report.md still ships
          # whenever anything real changes alongside it — including the day an
          # "## ⚠ ACTION REQUIRED" block first appears, which is real content.
          REAL=$(git diff --cached -- data/report.md | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | { grep -vc '^[+-]_Generated ' || true; })
          if [ "$REAL" -eq 0 ]; then
            git restore --staged --worktree data/report.md
          fi
          # AND THE SAME FOR THE CURSOR, for the same reason. The catalogue takes
          # about ten new entries a day across all games, so maxEntryId rises on
          # essentially every run — which means theater-cursor.json changes every
          # morning whether or not any of OUR data did. Left staged it would
          # retire the no-change-no-commit rule outright and put a deploy on the
          # calendar every day forever. Dropped when it is the only thing left,
          # the cursor simply does not advance on a quiet day and the next run
          # re-reads those pages; the cost is a page or two, bounded at ten.
          # (Written as an emptiness test on the remaining names rather than a
          # `git diff --quiet -- <paths>`: with the cursor filtered out that path
          # list can be EMPTY, and an empty pathspec means "everything", which
          # would silently invert the check.)
          OTHERS=$(git diff --cached --name-only | grep -v '^data/theater-cursor.json$' || true)
          if [ -z "$OTHERS" ]; then
            git restore --staged --worktree data/theater-cursor.json
          fi
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          N=$(node -p "require('./data/replays.json').length")
          git commit -m "data: refresh $(date -u +%F) — ${N} replays"
          git push

      # Deploy is Vercel's git integration off the push above — there is no
      # deploy step here to run "after", so this polls until production serves
      # the count we just committed. A build still in flight is a WARNING (it
      # serves yesterday's payload, a handful of records behind); a served count
      # outside the collapse guard's own band is a FAILURE. The guard in
      # parse.ts protects the repository; this protects what visitors get.
      #
      # Deliberately BEFORE "Flag due expiries": that step is designed to go red,
      # and a red step stops the ones after it.
      - name: Post-deploy smoke check
        run: npm run verify:deployed

      - name: Flag due expiries
        # Deliberately LAST and deliberately failing (scripts/expiries.ts).
        # The data has already been committed and pushed by the step above, so
        # a red run never costs a refresh — it only makes the pending work
        # impossible to miss. Two things can trip it, both on 2026-08-03:
        # Yasmine becoming playable, and the Season 4 boundary going unconfirmed.
        # Clear it by doing the work, NOT by deleting this step.
        run: npx tsx scripts/expiries.ts --check
